<!doctype html>
<html lang="en">
<head>
  <!--#include head-common-->
  <title>Contact CloudBridge Technologies | Start Your Project</title>
  <meta name="description" content="Contact CloudBridge Technologies to discuss your website, mobile app, business software or custom application project. We reply with clear next steps.">
  <link rel="canonical" href="{{siteUrl}}/contact/">
  <meta property="og:title" content="Contact CloudBridge Technologies | Start Your Project">
  <meta property="og:description" content="Tell us about your website, mobile app or software project. We reply with clear next steps.">
  <meta property="og:url" content="{{siteUrl}}/contact/">
  <meta name="twitter:title" content="Contact CloudBridge Technologies | Start Your Project">
  <meta name="twitter:description" content="Tell us about your website, mobile app or software project. We reply with clear next steps.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Contact CloudBridge Technologies",
    "url": "{{siteUrl}}/contact/",
    "isPartOf": { "@type": "WebSite", "name": "CloudBridge Technologies", "url": "{{siteUrl}}/" }
  }
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <!--#include scene-layers-->
  <!--#include header-->

  <main id="main">
    <section class="cta page-hero" data-shape="0" data-hero data-x="-0.26" data-dim="0.5" aria-labelledby="contact-title">
      <div class="wrap cta__grid">
        <div>
          <p class="eyebrow">Contact</p>
          <h1 id="contact-title" style="font-size:clamp(2.3rem,5vw,4.2rem)">Let&rsquo;s talk about your project.</h1>
          <p class="lead" style="margin-top:26px">Tell us what you want to build &mdash; a website, a mobile app, business software or a custom application. We will reply with clear next steps.</p>
          <dl class="cta__details">
            <div><dt>Email</dt><dd><a href="mailto:{{email}}">{{email}}</a></dd></div>
            <div><dt>Response</dt><dd>We aim to reply within one business day</dd></div>
          </dl>
        </div>
        <div>
          <!--#include contact-form-->
        </div>
      </div>
    </section>
  </main>

  <!--#include footer-->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
