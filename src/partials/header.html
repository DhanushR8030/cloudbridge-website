<header class="site-header" id="top">
  <div class="site-header__progress" aria-hidden="true"></div>
  <div class="wrap site-header__inner">
    <a class="brand" href="/" aria-label="CloudBridge Technologies - home">
      <svg class="brand__mark" viewBox="0 0 {{logoW}} {{logoH}}" aria-hidden="true" focusable="false">
        <path class="brand__green" d="{{logoGreen}}"/>
        <path class="brand__dark" d="{{logoDark}}"/>
      </svg>
      <span class="brand__text"><span class="brand__name">CloudBridge</span><span class="brand__sub">Technologies</span></span>
    </a>

    <nav class="nav" id="site-nav" aria-label="Primary">
      <a href="/services/">Services</a>
      <a href="/clients/">Clients</a>
      <a href="/process/">Process</a>
      <a href="/experience/">Experience</a>
      <a href="/contact/">Contact</a>
      <a class="btn btn--small btn--primary nav__cta" href="/contact/">Start a project</a>
    </nav>

    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
      <span></span><span></span>
    </button>
  </div>
</header>
